<template>
    <lightning-card title={labelOpportunityProducts}>

        <!-- PRODUCT TABLE -->
        <template if:true={hasProducts}>
            <lightning-datatable
                key-field="id"
                data={products}
                columns={columns}>
            </lightning-datatable>
        </template>

        <!-- NO PRODUCTS MESSAGE -->
        <template if:false={hasProducts}>
            <template for:each={noProductLines} for:item="line">
                <p key={line} class="slds-m-bottom_xx-small slds-p-left_small">
                    {line}
                </p>
            </template>
        </template>
        
        <!-- ERROR -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_medium">
                {error}
            </div>
        </template>

    </lightning-card>
</template>
